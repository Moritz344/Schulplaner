@if (settings.showAbout()) {
  <div class="screen">
  </div>
  <div class="container" animate.enter="enter-popup" animate.leave="leave-popup"> 
    <div class="container-content">
        <h1>{{ aboutData().name }} </h1>
        <p style="margin-bottom: -8px">{{ aboutData().version }} </p>
        <p style="color: var(--text-muted);margin: 10px;text-align: center">{{ aboutData().description }} </p>
    </div>

    <div class="close" (click)="onClose()">
      <button>
        <img src="close.svg">
      </button>
    </div>
  </div>
}
