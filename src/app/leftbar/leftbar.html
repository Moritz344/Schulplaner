      <span>Home</span></button>
    <button (click)="settings.view.set('timetable')" [class.selected]="settings.view() == 'timetable'"><img class="item-icon" src="timetable.svg">
      <span>Stundenplan</span></button>
    <button (click)="settings.view.set('exams')" [class.selected]="settings.view() == 'exams'"><img class="item-icon" src="exams.svg">
      <span>Prüfungen</span></button>
    <button (click)="settings.view.set('grades')" [class.selected]="settings.view() == 'grades'"><img class="item-icon" src="grades.svg">
      <span>Noten</span></button>
